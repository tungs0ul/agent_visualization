[package]
name = "room-app"
description = "Agent Room: watch Claude Code and its sub-agents work, and answer permission prompts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agent-room"
path = "src/main.rs"

[dependencies]
room-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# System fonts for the command hologram's text (Vietnamese, German, any script the
# Mac has), found by family name (`command_holo`).
bevy = { version = "0.20.1", features = ["system_font_discovery"] }
bevy_egui = "0.43.1"
# Markdown (headings, lists, code blocks) in Claude's final answer.
egui_commonmark = "0.25"
crossbeam-channel = "0.5"
# Images attached to chat messages (already built for Bevy).
base64 = "0.23"
# Images pasted from the clipboard (already built for bevy_egui).
arboard = "3.7"
png = "0.18"
