[package]
name = "room-app"
description = "Agent Room: watch Claude Code and its sub-agents work, and answer permission prompts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agent-room"
path = "src/main.rs"

[dependencies]
room-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bevy = "0.20.1"
bevy_egui = "0.43.1"
crossbeam-channel = "0.5"
bevy_prototype_lyon = "0.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
# The frosted widget background of mini mode (NSVisualEffectView).
window-vibrancy = "0.8.1"
