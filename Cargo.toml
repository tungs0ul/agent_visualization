[workspace]
resolver = "3"
members = ["crates/room-app", "crates/room-hook", "crates/room-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
room-proto = { path = "crates/room-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Bevy is unusably slow unoptimized; keep our own code fast to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
